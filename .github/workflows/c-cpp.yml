name: C/C++ CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

# https://github.com/git-lfs/git-lfs/issues/5749
env:
  GIT_CLONE_PROTECTION_ACTIVE: false

jobs:
  cmake-build:
      strategy:
        fail-fast: false
        matrix:
          config:
          - {
              name: "Windows - MSVC 2026",
              os: windows-2025-vs2026,
              build_type: "Debug",
              cc: "cl",
              cxx: "cl",
              generators: "Visual Studio 18 2026",
            }
          - {
              name: "Ubuntu - Clang",
              os: ubuntu-26.04,
              build_type: "Debug",
              cc: "clang-21",
              cxx: "clang++-21",
              generators: "Unix Makefiles",
            }
      runs-on: ${{ matrix.config.os }}

      steps:
        - uses: actions/checkout@v6
          with:
            submodules: recursive

        - if: startsWith(matrix.config.os, 'windows')
          run: |
            git config --system core.longpaths true
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          shell: pwsh

        - if: startsWith(matrix.config.os, 'ubuntu')
          run: |
            sudo apt-get update
            sudo apt-get install -y cmake gcc-15 clang-21 xorg-dev libxinerama-dev libxcursor-dev libgles2-mesa-dev libegl1-mesa-dev libglfw3-dev libglew-dev libstdc++-15-dev extra-cmake-modules libxkbcommon-x11-dev wayland-protocols libtbb-dev

        - name: Install Vulkan SDK
          uses: jakoch/install-vulkan-sdk-action@v1.5.5
          with:
            vulkan_version: 1.4.350.0
            install_runtime: true
            cache: true
            stripdown: true

        - name: Get the number of CPU cores
          id: cpu-cores
          uses: SimenB/github-actions-cpu-cores@v3

        - name: Run 'deploy_deps.py'
          run: python deploy_deps.py

        - name: Run 'LightweightVK deploy_deps.py'
          run: |
            cd deps/src/lightweightvk
            python deploy_deps.py

        - name: Build
          shell: bash
          env:
            CC:  ${{ matrix.config.cc }}
            CXX: ${{ matrix.config.cxx }}
          run: |
            cmake ${{ env.CMAKE_GENERATOR }} -S "${{ github.workspace }}" -B ~/build ${{ matrix.config.cmake_args }}
            cd ~/build
            cmake --build . --parallel ${{ steps.cpu-cores.outputs.count }}
